{% extends "base.html" %}
{% block content %}
<section class="panel">
  <div class="panel-head"><h2>Системные настройки</h2></div>
  <table>
    <thead>
      <tr>
        <th>Ключ</th>
        <th>Значение</th>
        <th>Описание</th>
        <th>Обновить</th>
      </tr>
    </thead>
    <tbody>
      {% for item in settings_rows %}
      <tr>
        <td>{{ item.key }}</td>
        <td class="break">{{ item.value }}</td>
        <td>{{ item.description or '—' }}</td>
        <td>
          <form method="post" action="/admin/settings" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="key" value="{{ item.key }}">
            <input type="text" name="value" value="{{ item.value }}">
            <button class="button ghost small" type="submit">Сохранить</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
