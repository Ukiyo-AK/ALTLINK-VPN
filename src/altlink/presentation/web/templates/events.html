{% extends "base.html" %}
{% block content %}
<section class="panel">
  <table class="table">
    <thead><tr><th>Уровень</th><th>Источник</th><th>Тип</th><th>Сообщение</th><th>Дата</th></tr></thead>
    <tbody>
      {% for event in events %}
      <tr>
        <td>{{ event.level }}</td>
        <td>{{ event.source }}</td>
        <td>{{ event.event_type }}</td>
        <td>{{ event.message }}</td>
        <td>{{ event.created_at|msk_datetime }}</td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="muted">Событий пока нет.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
