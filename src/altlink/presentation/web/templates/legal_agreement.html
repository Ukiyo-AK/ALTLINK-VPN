<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | ALTLINK</title>
  <link rel="icon" type="image/png" href="/media/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  {% include "_theme_bootstrap.html" %}
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body class="legal-page">
  <div class="portal-shell">
    <header class="portal-topbar">
      <a class="brand" href="/" style="margin: 0;">
        <img class="brand-logo" src="/media/logo.png" alt="ALTLINK">
        <div>
          <strong>ALTLINK</strong>
          <div class="muted">Юридические документы</div>
        </div>
      </a>
      <div class="toolbar legal-actions" style="margin-bottom: 0;">
        <a class="button ghost" href="/">Главная</a>
        <a class="button ghost" href="/help/connect">Подключение</a>
        <a class="button ghost legal-portal-link" href="/portal">Личный кабинет</a>
      </div>
    </header>

    <section class="hero">
      <article class="hero-panel">
        <span class="badge">Документ</span>
        <h1>{{ title }}</h1>
        <p class="muted">{{ document_excerpt }}</p>
      </article>
    </section>

    <section class="panel document-body legal-document-body">
      {{ document_html }}
    </section>
  </div>
</body>
</html>
