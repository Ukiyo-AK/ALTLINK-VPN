<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | ALTLINK</title>
  <link rel="icon" type="image/png" href="/media/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  {% include "_theme_bootstrap.html" %}
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>
  <div class="center-shell">
    <section class="login-card stack">
      <div class="brand">
        <img class="brand-logo" src="/media/logo.png" alt="ALTLINK">
        <div>
          <strong>ALTLINK</strong>
          <div class="muted">Вход в админ-панель</div>
        </div>
      </div>
      {% if error %}
      <div class="alert danger">{{ error }}</div>
      {% endif %}
      {% if flash %}
      <div class="alert {{ flash.level }}">{{ flash.message }}</div>
      {% endif %}
      <form method="post" class="stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>
          <span>Логин</span>
          <input type="text" name="username" required>
        </label>
        <label>
          <span>Пароль</span>
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="button full">Войти</button>
      </form>
    </section>
  </div>
</body>
</html>
