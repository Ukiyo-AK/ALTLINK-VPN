<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | ALTLINK</title>
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-kicker">ALTLINK</div>
        <div class="brand-title">Управление VPN</div>
      </div>
      <nav class="nav">
        <a class="{{ 'active' if page == 'dashboard' else '' }}" href="/admin">Dashboard</a>
        <a class="{{ 'active' if page == 'users' else '' }}" href="/admin/users">Пользователи</a>
        <a class="{{ 'active' if page == 'servers' else '' }}" href="/admin/servers">Серверы</a>
        <a class="{{ 'active' if page == 'topups' else '' }}" href="/admin/topups">Заявки</a>
        <a class="{{ 'active' if page == 'plans' else '' }}" href="/admin/plans">Тарифы</a>
        <a class="{{ 'active' if page == 'transactions' else '' }}" href="/admin/transactions">Баланс</a>
        <a class="{{ 'active' if page == 'traffic' else '' }}" href="/admin/traffic">Трафик</a>
        <a class="{{ 'active' if page == 'online' else '' }}" href="/admin/online">Онлайн</a>
        <a class="{{ 'active' if page == 'settings' else '' }}" href="/admin/settings">Настройки</a>
        <a class="{{ 'active' if page == 'events' else '' }}" href="/admin/events">Логи</a>
      </nav>
      <div class="sidebar-foot">
        {% if admin %}
        <div class="muted">Вошли как {{ admin.username }}</div>
        <form method="post" action="/admin/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="button ghost full" type="submit">Выйти</button>
        </form>
        {% endif %}
      </div>
    </aside>
    <main class="content">
      <header class="page-header">
        <div>
          <div class="eyebrow">Web admin panel</div>
          <h1>{{ title }}</h1>
        </div>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
