version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: altlink
      POSTGRES_USER: altlink
      POSTGRES_PASSWORD: altlink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altlink -d altlink"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "altlink.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  scheduler:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "altlink.scheduler.main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "altlink.cli", "check-heartbeat", "--path", "/tmp/altlink-scheduler.heartbeat", "--max-age", "120"]
      interval: 30s
      timeout: 5s
      retries: 5

  client-bot:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "altlink.presentation.bots.client_app"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "altlink.cli", "check-heartbeat", "--path", "/tmp/altlink-client-bot.heartbeat", "--max-age", "120"]
      interval: 30s
      timeout: 5s
      retries: 5

  admin-bot:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "altlink.presentation.bots.admin_app"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "altlink.cli", "check-heartbeat", "--path", "/tmp/altlink-admin-bot.heartbeat", "--max-age", "120"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
