[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altlink-vpn"
version = "0.1.0"
description = "ALTLINK VPN: backend, bots, scheduler and web admin panel for Remnawave-based VPN sales"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "aiogram>=3.13,<4.0",
  "alembic>=1.13,<2.0",
  "apscheduler>=3.10,<4.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "orjson>=3.10,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "qrcode[pil]>=7.4,<8.0",
  "sqlalchemy>=2.0.36,<3.0",
  "tenacity>=9.0,<10.0",
  "typer>=0.12,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[project.scripts]
altlink-cli = "altlink.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
altlink = [
  "presentation/web/templates/*.html",
  "presentation/web/static/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

