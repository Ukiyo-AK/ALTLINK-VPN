[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "altlink-vpn"
version = "0.1.0"
description = "Production-ready VPN sales and management system for Remnawave."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Codex" }
]
dependencies = [
  "aiogram>=3.22.0,<4.0.0",
  "alembic>=1.16.5,<2.0.0",
  "apscheduler>=3.11.1,<4.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "email-validator>=2.3.0,<3.0.0",
  "fastapi>=0.117.1,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "itsdangerous>=2.2.0,<3.0.0",
  "jinja2>=3.1.6,<4.0.0",
  "orjson>=3.11.3,<4.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "pillow>=11.3.0,<12.0.0",
  "psycopg[binary]>=3.2.10,<4.0.0",
  "pydantic-settings>=2.11.0,<3.0.0",
  "python-json-logger>=3.3.0,<4.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "qrcode[pil]>=8.2,<9.0",
  "redis>=6.4.0,<7.0.0",
  "slowapi>=0.1.9,<1.0.0",
  "sqlalchemy>=2.0.43,<3.0.0",
  "tenacity>=9.1.2,<10.0.0",
  "uvicorn[standard]>=0.36.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21.0,<1.0.0",
  "pytest>=8.4.2,<9.0.0",
  "pytest-asyncio>=1.2.0,<2.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/altlink"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["src/altlink"]
